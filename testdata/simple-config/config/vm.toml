machine = "pc,accel=kvm"
cpu = "host"
smp = 2
memory = "128M"
vga = "qxl"
display = "gtk,zoom-to-fit=on"
extra_args = ["-monitor", "stdio"]

[netdev.mynet0]
type = "user"

[audiodev.audio0]
driver = "pa"

[[device]]
driver = "ne2k_pci"
netdev = "mynet0"

[[drive]]
file = "disks/system.qcow2"
if = "ide"
bus = 0
unit = 0
